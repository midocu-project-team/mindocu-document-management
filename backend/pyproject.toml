[project]
name = "mindocu-document-management"
version = "0.1.0"
description = "Case-File Document-Scan"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "docling>=2.112.0",
    "fastapi>=0.136.3",
    "ipython>=9.14.0",
    "mlx-lm>=0.31.3",
    "ollama>=0.6.2",
    "outlines>=1.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "testcontainers[postgres]>=4.14.2",
]

[tool.pytest.ini_options]
# backend/ on sys.path so the top-level modules (datatypes, reader, ...) resolve.
# testpaths keeps collection off the test assets and the explore scratch scripts.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
