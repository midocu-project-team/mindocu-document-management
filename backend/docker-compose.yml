services:
  postgres:
    image: postgres:17
    container_name: mindocu-postgres
    environment:
      POSTGRES_USER: mindocu
      POSTGRES_PASSWORD: mindocu
      POSTGRES_DB: mindocu
    ports:
      - "5432:5432"
    volumes:
      - mindocu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindocu -d mindocu"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mindocu_pgdata:
